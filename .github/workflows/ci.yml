name: SAI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Migrations
      working-directory: ./backend
      run: |
        alembic upgrade head

    - name: Seed Database Check
      working-directory: ./backend
      run: |
        python seed.py

    - name: Run Test Suite
      working-directory: ./backend
      run: |
        pytest -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        cache-dependency-path: './SAI-Figma-Test/pnpm-lock.yaml'

    - name: Install Frontend Dependencies
      working-directory: ./SAI-Figma-Test
      run: |
        pnpm install

    - name: Build Frontend
      working-directory: ./SAI-Figma-Test
      run: |
        pnpm build
