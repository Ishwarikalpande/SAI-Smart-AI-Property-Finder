<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAI Smart AI Property Finder</title>
    <meta name="description" content="An AI-powered real estate platform enabling buyers, sellers, builders, and agents to discover, compare, and transact properties via conversational search." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      /* Suppress Google Translate default top banner and iframe offset */
      .goog-te-banner-frame, .goog-te-banner-frame.skiptranslate, .goog-te-banner { display: none !important; }
      body { top: 0px !important; position: static !important; }
      #goog-gt-tt, .goog-te-balloon-frame, .goog-tooltip, .goog-tooltip:hover { display: none !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
      .skiptranslate > iframe { display: none !important; }
      iframe.goog-te-banner-frame { display: none !important; }
    </style>
    <!-- Leaflet Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>

  <body>
    <!-- Google Translate Element (Offscreen but layout-active for script) -->
    <div id="google_translate_element" style="position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;"></div>

    <div id="root"></div>

    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,hi,mr,gu,ta,te,kn,bn',
              autoDisplay: false,
              layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
          }
        } catch (e) {
          console.warn('Google Translate initialization:', e);
        }
      };
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
